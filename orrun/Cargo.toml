[package]
name = "orrun"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orrun — continental atlas and game content on the Engine"
default-run = "orrun"

[[bin]]
name = "orrun"
path = "src/main.rs"

[[bin]]
name = "hamlet_lab"
path = "src/bin/hamlet_lab.rs"

[[bin]]
name = "continent"
path = "src/bin/continent.rs"

[[bin]]
name = "void_walk_diag"
path = "src/bin/void_walk_diag.rs"

[[bin]]
name = "chunk_cost"
path = "src/bin/chunk_cost.rs"

[[bin]]
name = "brook_map"
path = "src/bin/brook_map.rs"

[dependencies]
engine = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
