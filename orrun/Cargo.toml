[package]
name = "orrun"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orrun — continental atlas and game content on the Engine"
default-run = "orrun"

[lints]
workspace = true

[[bin]]
name = "orrun"
path = "src/main.rs"

[[bin]]
name = "playtester"
path = "src/bin/playtester.rs"

[[bin]]
name = "hamlet_lab"
path = "src/bin/hamlet_lab.rs"

[[bin]]
name = "continent"
path = "src/bin/continent.rs"

[[bin]]
name = "void_walk_diag"
path = "src/bin/void_walk_diag.rs"

[[bin]]
name = "chunk_cost"
path = "src/bin/chunk_cost.rs"

[[bin]]
name = "pond_map"
path = "src/bin/pond_map.rs"

[dependencies]
engine = { workspace = true }
modular = { workspace = true }
cave_gen = { workspace = true }
dungeon_kit = { path = "../../Modular/examples/dungeon_kit" }
glam = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { version = "0.42.0", features = ["serialize"] }
